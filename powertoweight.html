 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP Per Ton Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    .box {
        background: #1e1e1e;
        padding: 24px;
        border-radius: 12px;
        width: 420px;
    }

    h1 {
        font-size: 24px;
        margin-top: 0;
        text-align: center;
    }

    h2 {
        font-size: 16px;
        margin-bottom: 8px;
    }

    .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
    }

    .preset-btn {
        background: #333;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 14px;
    }

    .preset-btn:hover {
        background: #555;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 16px;
        border: none;
        border-radius: 6px;
        box-sizing: border-box;
    }

    button.calculate {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4caf50;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button.calculate:hover {
        background: #43a047;
    }

    #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>

<body>

<div class="box">

    <h1>HP Per Ton Calculator</h1>

<label>Filter Region</label>
<select id="regionFilter" onchange="filterCars()">
    <option value="all">All</option>
    <option value="jdm">JDM</option>
    <option value="euro">Euro</option>
    <option value="usdm">American</option>
</select>
    
    <h2>Cars</h2>
    <div class="preset-row">
    <button class="preset-btn" onclick="setCar(1900, 108)">CRX</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2100, 92)">EF Hatch</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2300, 92)">EF Sedan</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2400, 125)">EG Coupe</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2450, 125)">EG Sedan</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2200, 125)">EG Hatch</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2400, 160)">Del Sol</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2400, 127)">EK Hatch</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2550, 160)">EK Coupe</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2600, 160)">EK Sedan</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2700, 200)">DC2 Integra</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2877, 197)">8th Gen Civic Si</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(3188, 315)">FL5 Type R</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2100, 116)">NA Miata</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2300, 133)">NB Miata</button>

    <button class="preset-btn" data-region="jdm" onclick="setCar(2760, 200)">1st Gen BRZ</button>
    <button class="preset-btn" data-region="jdm" onclick="setCar(2815, 228)">2nd Gen BRZ</button>

    <button class="preset-btn" data-region="usdm" onclick="setCar(3550, 310)">Mustang EcoBoost</button>
    <button class="preset-btn" data-region="usdm" onclick="setCar(3825, 480)">Mustang GT</button>

    <button class="preset-btn" data-region="usdm" onclick="setCar(3223, 252)">Focus ST</button>
    <button class="preset-btn" data-region="usdm" onclick="setCar(3459, 350)">Focus RS</button>

    <button class="preset-btn" data-region="usdm" onclick="setCar(3685, 455)">Camaro SS</button>
    <button class="preset-btn" data-region="usdm" onclick="setCar(3880, 650)">Camaro ZL1</button>

    <button class="preset-btn" data-region="usdm" onclick="setCar(3975, 303)">Challenger SXT</button>
    <button class="preset-btn" data-region="usdm" onclick="setCar(4250, 375)">Challenger R/T</button>
    <button class="preset-btn" data-region="usdm" onclick="setCar(4450, 717)">Challenger Hellcat</button>

    <button class="preset-btn" data-region="euro" onclick="setCar(3200, 225)">E46 330i</button>
    <button class="preset-btn" data-region="euro" onclick="setCar(3415, 333)">E46 M3</button>

    <button class="preset-btn" data-region="euro" onclick="setCar(3200, 241)">Golf GTI</button>
    <button class="preset-btn" data-region="euro" onclick="setCar(3460, 315)">Golf R</button>

        
    </div>

    <label>Weight (lbs)</label>
    <input type="number" id="weight" placeholder="3000">

    <label>Horsepower</label>
    <input type="number" id="hp" placeholder="250">

    <button class="calculate" onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <h2 style="margin-top: 30px;">Engines</h2>
    <div class="preset-row">
        <button class="preset-btn" onclick="setHP(116)">Mazda B6</button>
        <button class="preset-btn" onclick="setHP(133)">Mazda BP</button>
        
        <button class="preset-btn" onclick="setHP(125)">Honda D16</button>
        <button class="preset-btn" onclick="setHP(160)">Honda B16</button>
        <button class="preset-btn" onclick="setHP(180)">Honda B18</button>
        <button class="preset-btn" onclick="setHP(200)">Honda H22</button>
        <button class="preset-btn" onclick="setHP(220)">Honda K20A</button>
        <button class="preset-btn" onclick="setHP(205)">Honda K24A</button>
        <button class="preset-btn" onclick="setHP(315)">Honda K20C1</button>
        <button class="preset-btn" onclick="setHP(280)">Honda J35</button>
        
        <button class="preset-btn" onclick="setHP(200)">Subaru FA20</button>
        <button class="preset-btn" onclick="setHP(228)">Subaru FA24</button>
        <button class="preset-btn" onclick="setHP(271)">Subaru FA24DIT</button>
        
        <button class="preset-btn" onclick="setHP(252)">Ford 2.0 EcoBoost</button>
        <button class="preset-btn" onclick="setHP(310)">Ford 2.3 EcoBoost (Mustang)</button>
        <button class="preset-btn" onclick="setHP(350)">Ford 2.3 EcoBoost (RS)</button>
        <button class="preset-btn" onclick="setHP(480)">Ford 5.0 Coyote</button>

        <button class="preset-btn" onclick="setHP(455)">GM 6.2 LT1</button>
        <button class="preset-btn" onclick="setHP(650)">GM 6.2 Supercharged LT4</button>

        <button class="preset-btn" onclick="setHP(303)">Dodge 3.6 Pentastar</button>
        <button class="preset-btn" onclick="setHP(375)">Dodge 5.7 Hemi</button>
        <button class="preset-btn" onclick="setHP(717)">Dodge 6.2 Hellcat</button>

        <button class="preset-btn" onclick="setHP(184)">BMW M54B25</button>
        <button class="preset-btn" onclick="setHP(225)">BMW M54 B30</button>
        <button class="preset-btn" onclick="setHP(333)">BMW S54</button>

        <button class="preset-btn" onclick="setHP(241)">EA888 GTI</button>
        <button class="preset-btn" onclick="setHP(315)">EA888 Golf R</button>
    </div>

</div>

<script>
function setWeight(weight) {
    document.getElementById("weight").value = weight;
}

function setCar(weight, hp) {
    document.getElementById("weight").value = weight;
    document.getElementById("hp").value = hp;
    calculate();
}

function setHP(hp) {
    document.getElementById("hp").value = hp;
}

function calculate() {
    const weight = parseFloat(document.getElementById("weight").value);
    const hp = parseFloat(document.getElementById("hp").value);

    if (!weight || !hp) {
        document.getElementById("result").innerText = "Enter valid numbers";
        return;
    }

    const tons = weight / 2000;
    const hpPerTon = hp / tons;

    document.getElementById("result").innerText =
        hpPerTon.toFixed(1) + " HP/ton";
}
    
function filterCars() {
    const region = document.getElementById("regionFilter").value;
    const cars = document.querySelectorAll("[data-region]");

    cars.forEach(btn => {
        if (region === "all" || btn.dataset.region === region) {
            btn.style.display = "inline-block";
        } else {
            btn.style.display = "none";
        }
    });
}
</script>

</body>
</html>
