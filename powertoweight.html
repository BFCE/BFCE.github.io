<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP Per Ton Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
    }

    .box {
        background: #1e1e1e;
        padding: 24px;
        border-radius: 12px;
        width: 420px;
    }

    h1 {
        font-size: 24px;
        margin-top: 0;
        text-align: center;
    }

    h2 {
        font-size: 16px;
        margin-bottom: 8px;
    }

    .preset-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
    }

    .preset-btn {
        background: #333;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 14px;
    }

    .preset-btn:hover {
        background: #555;
    }

    input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        margin-bottom: 16px;
        border: none;
        border-radius: 6px;
        box-sizing: border-box;
    }

    button.calculate {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #4caf50;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button.calculate:hover {
        background: #43a047;
    }

    #result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>

<body>

<div class="box">

    <h1>HP Per Ton Calculator</h1>

    <h2>Cars</h2>
    <div class="preset-row">
        <button class="preset-btn" onclick="setWeight(1900)">CRX</button>
        <button class="preset-btn" onclick="setWeight(2100)">EF Hatch</button>
        <button class="preset-btn" onclick="setWeight(2300)">EF Sedan</button>
        <button class="preset-btn" onclick="setWeight(2400)">EG Coupe</button>
        <button class="preset-btn" onclick="setWeight(2450)">EG Sedan</button>
        <button class="preset-btn" onclick="setWeight(2200)">EG Hatch</button>
        <button class="preset-btn" onclick="setWeight(2400)">Del Sol</button>
        <button class="preset-btn" onclick="setWeight(2400)">EK Hatch</button>
        <button class="preset-btn" onclick="setWeight(2550)">EK Coupe</button>
        <button class="preset-btn" onclick="setWeight(2600)">EK Sedan</button>
        <button class="preset-btn" onclick="setWeight(2700)">DC2 Integra</button>
        <button class="preset-btn" onclick="setWeight(2877)">8th Gen Civic Si</button>
        <button class="preset-btn" onclick="setWeight(3188)">FL5 Type R</button>
        
        <button class="preset-btn" onclick="setWeight(2100)">NA Miata</button>
        <button class="preset-btn" onclick="setWeight(2300)">NB Miata</button>
        
        <button class="preset-btn" onclick="setWeight(2760)">1st Gen BRZ</button>
        <button class="preset-btn" onclick="setWeight(2815)">2nd Gen BRZ</button>

        <button class="preset-btn" onclick="setWeight(3550)">Mustang EcoBoost</button>
        <button class="preset-btn" onclick="setWeight(3825)">Mustang GT</button>
        <button class="preset-btn" onclick="setWeight(3223)">Focus ST</button>
        <button class="preset-btn" onclick="setWeight(3459)">Focus RS</button>

        <button class="preset-btn" onclick="setWeight(3685)">Camaro SS</button>
        <button class="preset-btn" onclick="setWeight(3880)">Camaro ZL1</button>

        <button class="preset-btn" onclick="setWeight(3975)">Challenger SXT</button>
        <button class="preset-btn" onclick="setWeight(4250)">Challenger R/T</button>
        <button class="preset-btn" onclick="setWeight(4450)">Challenger Hellcat</button>

        <button class="preset-btn" onclick="setWeight(3200)">E46</button>
        <button class="preset-btn" onclick="setWeight(3415)">E46 M3</button>

        <button class="preset-btn" onclick="setWeight(3200)">Golf GTI</button>
        <button class="preset-btn" onclick="setWeight(3460)">Golf R</button>

        
    </div>

    <label>Weight (lbs)</label>
    <input type="number" id="weight" placeholder="3000">

    <label>Horsepower</label>
    <input type="number" id="hp" placeholder="250">

    <button class="calculate" onclick="calculate()">Calculate</button>

    <div id="result"></div>

    <h2 style="margin-top: 30px;">Engines</h2>
    <div class="preset-row">
        <button class="preset-btn" onclick="setHP(116)">Mazda B6</button>
        <button class="preset-btn" onclick="setHP(133)">Mazda BP</button>
        
        <button class="preset-btn" onclick="setHP(125)">Honda D16</button>
        <button class="preset-btn" onclick="setHP(160)">Honda B16</button>
        <button class="preset-btn" onclick="setHP(180)">Honda B18</button>
        <button class="preset-btn" onclick="setHP(200)">Honda H22</button>
        <button class="preset-btn" onclick="setHP(220)">Honda K20A</button>
        <button class="preset-btn" onclick="setHP(205)">Honda K24A</button>
        <button class="preset-btn" onclick="setHP(315)">Honda K20C1</button>
        <button class="preset-btn" onclick="setHP(280)">Honda J35</button>
        
        <button class="preset-btn" onclick="setHP(200)">Subaru FA20</button>
        <button class="preset-btn" onclick="setHP(228)">Subaru FA24</button>
        <button class="preset-btn" onclick="setHP(271)">Subaru FA24DIT</button>
        
        <button class="preset-btn" onclick="setHP(252)">Ford 2.0 EcoBoost</button>
        <button class="preset-btn" onclick="setHP(310)">Ford 2.3 EcoBoost (Mustang)</button>
        <button class="preset-btn" onclick="setHP(350)">Ford 2.3 EcoBoost (RS)</button>
        <button class="preset-btn" onclick="setHP(480)">Ford 5.0 Coyote</button>

        <button class="preset-btn" onclick="setHP(455)">GM 6.2 LT1</button>
        <button class="preset-btn" onclick="setHP(650)">GM 6.2 Supercharged LT4</button>

        <button class="preset-btn" onclick="setHP(303)">Dodge 3.6 Pentastar</button>
        <button class="preset-btn" onclick="setHP(375)">Dodge 5.7 Hemi</button>
        <button class="preset-btn" onclick="setHP(717)">Dodge 6.2 Hellcat</button>

        <button class="preset-btn" onclick="setHP(184)">BMW M54B25</button>
        <button class="preset-btn" onclick="setHP(225)">BMW M54 B30</button>
        <button class="preset-btn" onclick="setHP(333)">BMW S54</button>

        <button class="preset-btn" onclick="setHP(241)">EA888 GTI</button>
        <button class="preset-btn" onclick="setHP(315)">EA888 Golf R</button>
    </div>

</div>

<script>
function setWeight(weight) {
    document.getElementById("weight").value = weight;
}

function setHP(hp) {
    document.getElementById("hp").value = hp;
}

function calculate() {
    const weight = parseFloat(document.getElementById("weight").value);
    const hp = parseFloat(document.getElementById("hp").value);

    if (!weight || !hp) {
        document.getElementById("result").innerText = "Enter valid numbers";
        return;
    }

    const tons = weight / 2000;
    const hpPerTon = hp / tons;

    document.getElementById("result").innerText =
        hpPerTon.toFixed(1) + " HP/ton";
}
</script>

</body>
</html>
